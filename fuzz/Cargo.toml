[package]
name = "smallvec-fuzz"
version = "0.0.0"
authors = ["The Servo Project Developers"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.smallvec]
path = ".."

[[bin]]
name = "smallvec_ops"
path = "fuzz_targets/smallvec_ops.rs"
test = false
doc = false
bench = false
