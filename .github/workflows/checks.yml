name: checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [v2]
  workflow_dispatch:
jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: default features
        run: cargo bench --no-run
      - name: all features
        run: cargo bench --all-features --no-run
  callgrind:
    name: Callgrind
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install
        uses: dtolnay/rust-toolchain@nightly
      - name: default features
        run: |
          sudo apt-get update -y
          sudo apt-get install -y valgrind
          version=$(cargo metadata --format-version=1 |
            jq -r '.packages[] | select(.name == "iai-callgrind").version')
          cargo install iai-callgrind-runner --version "$version"
          cargo bench --bench callgrind --profile callgrind
      - name: all features
        run: cargo bench --bench callgrind --profile callgrind --all-features
  practices:
    name: Practices
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: style
        run: |
          rustup component add rustfmt
          cargo fmt --all --check
      - name: clippy
        run: |
          rustup component add clippy
          cargo clippy
      - name: docs
        run: cargo doc --all-features
      - name: markdownlint
        run: |
          git ls-files '*.md' -z |
          xargs -0 docker run --rm \
          -v "$PWD:/work" -w /work \
          ghcr.io/igorshubovych/markdownlint-cli:v0.41.0
      - name: yamllint
        run: |
          git ls-files '*.yaml' '*.yml' |
          xargs docker run --rm -v "$PWD:/work" -w /work cytopia/yamllint
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: default features
        run: cargo package
      - name: all features
        run: cargo package --all-features
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: default features
        run: |
          rustup component add miri
          cargo miri test
      - name: all features
        run: cargo miri test --all-features
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: test default features
        run: cargo test
      - name: test all features
        run: cargo test --all-features
  nostd:
    name: NoStd
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust nighlty
        uses: dtolnay/rust-toolchain@nightly
        with:
          target: thumbv7m-none-eabi
      - name: build default features
        run: cargo build
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install rust MSRV
        uses: dtolnay/rust-toolchain@1.86
      - name: build default features
        run: cargo build
