name: checks
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
jobs:
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo bench --no-run
      - run: cargo bench --all-features --no-run
  practices:
    name: Practices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy
      - run: cargo doc --all-features
      - run: |
          git ls-files '*.md' -z |
          xargs -0 docker run --rm \
          -v "$PWD:/work" -w /work \
          ghcr.io/igorshubovych/markdownlint-cli:v0.41.0
      - run: |
          git ls-files '*.yaml' '*.yml' |
          xargs docker run --rm -v "$PWD:/work" -w /work cytopia/yamllint
      - run: |
          git ls-files '*.toml' -z |
          xargs -0 docker run --rm \
          -v "$PWD:/work" -w /work \
          tamasfe/taplo:0.10.0 fmt --check
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo package
      - run: cargo package --all-features
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo miri test
      - run: cargo miri test --all-features
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test
      - run: cargo test --all-features
  nostd:
      name: NoStd
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: dtolnay/rust-toolchain@nightly
          with:
            target: thumbv7m-none-eabi
        - run: cargo build
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.36
      - run: cargo build
