name: CI

on:
  push:
    branches: [v2]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

jobs:
  linux-ci:
    name: Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["stable", "beta", "nightly", "1.83.0"]
        include:
          - toolchain: stable
            fuzz: 1
          - toolchain: beta
            fuzz: 1
    steps:
      - uses: actions/checkout@v4

      - name: Install packages for fuzzing
        if: runner.os == 'Linux' && matrix.fuzz == 1
        run: sudo apt-get update -y && sudo apt-get install -y binutils-dev libunwind8-dev libcurl4-openssl-dev libelf-dev libdw-dev cmake gcc libiberty-dev

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
        
      - name: Style check
        if: matrix.toolchain == 'nightly'
        run: rustup component add rustfmt && cargo fmt --all --check

      - name: Cargo build
        run: cargo build --verbose

      - name: Cargo test no features
        run: cargo test --verbose

      - name: Cargo test all features
        if: matrix.toolchain == 'nightly'
        run: cargo test --verbose --all-features

      - name: Cargo doc all features
        if: matrix.toolchain == 'nightly'
        run: cargo doc --all-features --verbose

      - name: Cargo bench all features
        if: matrix.toolchain == 'nightly'
        run: cargo bench --verbose --all-features

      - name: miri
        if: matrix.toolchain == 'nightly'
        run: rustup component add miri && cargo miri test --verbose --all-features

      - name: fuzz
        if: matrix.fuzz == 1
        working-directory: fuzz
        run: ./travis-fuzz.sh

  no-std:
    name: no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: thumbv7m-none-eabi
      - name: Cargo build
        run: cargo build --verbose

  build_result:
    name: homu build finished
    runs-on: ubuntu-latest
    needs:
      - "linux-ci"
      - "no-std"

    steps:
      - name: Mark the job as successful
        run: exit 0
        if: success()
      - name: Mark the job as unsuccessful
        run: exit 1
        if: "!success()"

