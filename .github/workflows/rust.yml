name: Rust

on:
  push:
    branches: [v2]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: stable
            toolchain: stable
          - name: beta
            toolchain: beta
          - name: nightly
            toolchain: nightly
            nightly: true
            fuzz: true
          - name: MSRV
            toolchain: "1.86.0"
          - name: no_std
            toolchain: stable
            target: thumbv7m-none-eabi
            no_std: true
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          target: ${{ matrix.target }}

      - name: Style check
        if: matrix.nightly
        run: rustup component add rustfmt && cargo fmt --all --check

      - name: Clippy check
        if: matrix.nightly
        run: rustup component add clippy && cargo clippy --all-features --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        if: ${{ !matrix.no_std }}
        run: cargo test --verbose

      - name: Cargo test no default features
        if: matrix.nightly
        run: cargo test --verbose --no-default-features

      - name: Cargo test all features
        if: matrix.nightly
        run: cargo test --verbose --all-features

      - name: Cargo doc all features
        if: matrix.nightly
        run: cargo doc --all-features --verbose

      - name: Cargo bench no default features
        if: matrix.nightly
        run: cargo clean && cargo bench --verbose --no-default-features

      - name: Cargo bench all features
        if: matrix.nightly
        run: cargo clean && cargo bench --verbose --all-features

      - name: miri
        if: matrix.nightly
        run: rustup component add miri && cargo miri test --verbose --all-features

      - name: Run Fuzzer
        if: matrix.fuzz
        run: cargo install cargo-fuzz && cargo fuzz run smallvec_ops -- -max_total_time=60

  build_result:
    name: homu build finished
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Mark the job as successful
        run: exit 0
        if: success()
      - name: Mark the job as unsuccessful
        run: exit 1
        if: "!success()"
