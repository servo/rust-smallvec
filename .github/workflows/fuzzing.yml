name: fuzzing
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
jobs:
  fuzz:
    name: Fuzz
    if: github.repository == 'servo/rust-smallvec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - run: cargo install cargo-fuzz
      - run: cargo fuzz run main -- -max_total_time=3600 -rss_limit_mb=4096
      - run: cargo fuzz cmin main
        if: always()
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
