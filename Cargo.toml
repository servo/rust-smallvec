[package]
name = "smallvec"
version = "1.16.2"
edition = "2018"
authors = ["The Servo Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/rust-smallvec"
description = "'Small vector' optimization: store up to a small number of items on the stack"
keywords = ["small", "vec", "vector", "stack", "no_std"]
categories = ["data-structures"]
documentation = "https://docs.rs/smallvec/"
include = ["Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE", "README.md", "src/**/*.rs"]

# Dedicated profile for the iai-callgrind benchmarks. Callgrind needs the
# function symbols in the binary to attribute event counts, so we disable
# stripping (and keep debug info for line-level detail). Without symbols the
# runner collects zero events for every benchmark. LTO is left on (inherited)
# since it does not affect collection and keeps the run representative.
[profile.callgrind]
inherits = "bench"
debug = 1
strip = false

[features]
const_generics = []
const_new = ["const_generics"]
write = []
union = []
specialization = []
may_dangle = []
drain_filter = []
drain_keep_rest = ["drain_filter"]
impl_bincode = ["bincode", "unty"]

[dependencies]
serde = { version = "1", optional = true, default-features = false }
malloc_size_of = { version = "0.1", optional = true, default-features = false }
arbitrary = { version = "1", optional = true }
bincode = { version = "2", optional = true, default-features = false }
unty = { version = "0.0.4", optional = true, default-features = false }

[dev-dependencies]
bincode1 = { package = "bincode", version = "1.0.1" }
iai-callgrind = "0.14"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[workspace]
members = [
    ".",
    "fuzz",		
]