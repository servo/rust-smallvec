[package]
name = "smallvec"
version = "2.0.0-alpha.12"
edition = "2024"
rust-version = "1.86"
authors = ["The Servo Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/servo/rust-smallvec"
description = "'Small vector' optimization: store up to a small number of items on the stack"
keywords = ["small", "vec", "vector", "stack", "no_std"]
categories = ["data-structures"]
readme = "README.md"
documentation = "https://docs.rs/smallvec/"
exclude = [".gitignore", "tests/", "fuzz/", "benches/", ".github/"]

[features]
std = []
specialization = []
may_dangle = []
serde = ["dep:serde_core"]
internals = []

[dependencies]
arbitrary = { version = "1", optional = true, default-features = false }
bytes = { version = "1", optional = true, default-features = false }
serde_core = { version = "1.0.221", optional = true, default-features = false }
malloc_size_of = { version = "0.1.1", optional = true, default-features = false }

[dev-dependencies]
serde_test = "1.0"
criterion = "0.4.0"

[[test]]
name = "arbitrary"
required-features = ["arbitrary"]

[[test]]
name = "bytes"
required-features = ["bytes"]

[[test]]
name = "serde"
required-features = ["serde"]

[[test]]
name = "std"
required-features = ["std"]

[[bench]]
name = "bench"
path = "benches/bench.rs"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
